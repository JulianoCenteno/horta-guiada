<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horta Guiada</title>
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/icone-192.png">
<meta name="theme-color" content="#1F6B3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root {
  /* Um único tema claro, de alto contraste, pensado para leitura 50+.
     Layout: coluna de celular, uma tarefa por tela, barra de abas fixa embaixo. */
  --folha: #1F6B3A;
  --folha-escura: #134A27;
  --broto: #E3F1E5;
  --agua: #1D5F8C;
  --agua-clara: #E2EEF6;
  --sol: #F4C542;
  --sol-claro: #FDF3D3;
  --papel: #F6F9F5;
  --cartao: #FFFFFF;
  --tinta: #16231A;
  --tinta-suave: #44544A;
  --linha: #C9D7CD;
  --alerta: #A8401B;
  --alerta-claro: #FBE9E2;
  --fonte-titulo: "Fraunces", Georgia, "Times New Roman", serif;
  --fonte-texto: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { font-size: 19px; height: 100%; }
html.letra-grande { font-size: 22px; }
html.letra-enorme { font-size: 25px; }
body {
  margin: 0; height: 100%;
  background: #DCE6DE;
  color: var(--tinta);
  font-family: var(--fonte-texto);
  line-height: 1.5;
}
button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 3px solid var(--agua); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app {
  max-width: 520px; margin: 0 auto; height: 100%;
  display: grid; grid-template-rows: auto 1fr auto;
  background: var(--papel);
  box-shadow: 0 0 0 1px var(--linha);
}
.topo {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.6rem 1rem; background: var(--cartao);
  border-bottom: 1px solid var(--linha);
}
.marca { display: flex; align-items: center; gap: 0.5rem; flex: 1; min-width: 0; }
.marca strong { font-family: var(--fonte-titulo); font-size: 1.05rem; line-height: 1.05; color: var(--folha-escura); }
.marca svg { flex: none; }
.btn:disabled { opacity: 0.4; cursor: default; }
@media (max-width: 380px) { .btn-topo { padding: 0 0.55rem; } }
.btn-topo {
  min-height: 48px; padding: 0 0.8rem; border-radius: 12px;
  border: 2px solid var(--linha); background: var(--cartao);
  display: inline-flex; align-items: center; gap: 0.35rem;
  font-weight: 700; font-size: 0.85rem; cursor: pointer;
}
.btn-topo svg { width: 22px; height: 22px; }

main { overflow-y: auto; padding: 1rem 1rem 2rem; display: flex; flex-direction: column; gap: 1rem; }

.abas {
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--cartao); border-top: 1px solid var(--linha);
}
.aba {
  min-height: 68px; border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 0.72rem; font-weight: 700; color: var(--tinta-suave); padding: 0.3rem 0;
}
.aba svg { width: 28px; height: 28px; }
.aba[aria-current="page"] { color: var(--folha); background: var(--broto); }

h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.2; text-wrap: balance; margin: 0; color: var(--folha-escura); }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.suave { color: var(--tinta-suave); }
.pequeno { font-size: 0.85rem; }

.cartao {
  background: var(--cartao); border: 1px solid var(--linha); border-radius: 18px;
  padding: 1.1rem; display: flex; flex-direction: column; gap: 0.75rem;
}
.cartao.hoje { background: var(--sol-claro); border: 2px solid var(--sol); }
.cartao.agua { background: var(--agua-clara); border-color: #B7D0E2; }
.cartao.alerta { background: var(--alerta-claro); border-color: #E7B9A6; }
.cartao.verde { background: var(--broto); border-color: #B9D8BF; }

.etiqueta {
  align-self: flex-start; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.02em;
  padding: 0.2rem 0.6rem; border-radius: 999px; background: var(--folha); color: #fff;
}
.etiqueta.sol { background: var(--tinta); color: var(--sol); }
.etiqueta.agua { background: var(--agua); }
.etiquetas { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip { font-size: 0.8rem; font-weight: 700; padding: 0.25rem 0.65rem; border-radius: 999px; background: var(--broto); color: var(--folha-escura); border: 1px solid #B9D8BF; }

.btn {
  min-height: 60px; width: 100%; border-radius: 14px; cursor: pointer;
  border: 2px solid var(--folha); background: var(--folha); color: #fff;
  font-weight: 700; font-size: 1.05rem; padding: 0.6rem 1rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; text-align: center;
}
.btn:hover { background: var(--folha-escura); }
.btn.secundario { background: var(--cartao); color: var(--folha-escura); }
.btn.secundario:hover { background: var(--broto); }
.btn.agua { background: var(--agua); border-color: var(--agua); }
.btn svg { width: 24px; height: 24px; flex: none; }
.btns { display: flex; flex-direction: column; gap: 0.6rem; }
.btns.lado { flex-direction: row; }
.btns.lado .btn { flex: 1; }

.opcoes { display: flex; flex-direction: column; gap: 0.65rem; }
.opcao {
  min-height: 64px; width: 100%; text-align: left; cursor: pointer;
  border: 2px solid var(--linha); border-radius: 14px; background: var(--cartao);
  padding: 0.7rem 1rem; font-size: 1.02rem; font-weight: 700;
  display: flex; align-items: center; gap: 0.8rem;
}
.opcao:hover { border-color: var(--folha); background: var(--broto); }
.opcao .marcador { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--tinta-suave); flex: none; }
.opcao small { display: block; font-weight: 400; color: var(--tinta-suave); font-size: 0.85rem; }

.passos { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 0.4rem; }
.passos li::marker { font-weight: 700; color: var(--folha); }

.progresso { height: 14px; border-radius: 999px; background: var(--broto); overflow: hidden; border: 1px solid #B9D8BF; }
.progresso > span { display: block; height: 100%; background: var(--folha); border-radius: 999px; }

.lista-tarefas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista-tarefas li { display: flex; gap: 0.8rem; padding: 0.7rem 0; border-top: 1px solid var(--linha); align-items: baseline; }
.lista-tarefas li:first-child { border-top: 0; }
.lista-tarefas .quando { min-width: 6.2rem; font-weight: 700; color: var(--agua); font-size: 0.9rem; }

.desenho { background: var(--agua-clara); border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; }
.desenho img { width: 100%; height: 100%; object-fit: cover; display: block; }

.banner {
  background: var(--tinta); color: #fff; border-radius: 16px; padding: 0.9rem 1rem;
  display: flex; flex-direction: column; gap: 0.6rem;
}
.banner .btn { background: var(--sol); border-color: var(--sol); color: var(--tinta); min-height: 54px; }

.contador { display: flex; align-items: center; gap: 0.6rem; }
.contador button {
  width: 64px; height: 64px; border-radius: 14px; border: 2px solid var(--folha);
  background: var(--cartao); color: var(--folha-escura); font-size: 1.8rem; font-weight: 700; cursor: pointer;
}
.contador output { flex: 1; text-align: center; font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }

.resultado-colher { display: flex; justify-content: space-between; gap: 0.8rem; padding: 0.7rem 0; border-top: 1px solid #B7D0E2; align-items: baseline; }
.resultado-colher:first-child { border-top: 0; }
.resultado-colher strong { font-size: 1.15rem; text-align: right; }

.fitas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.fita {
  min-height: 84px; border-radius: 12px; border: 3px solid transparent; cursor: pointer;
  display: flex; align-items: flex-end; justify-content: center; padding: 0.3rem;
  font-weight: 700; font-size: 0.85rem; color: var(--tinta);
}
.fita span { background: rgba(255,255,255,0.88); border-radius: 8px; padding: 0 0.4rem; }
.fita[aria-pressed="true"] { border-color: var(--tinta); }

.album { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.foto { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.foto .img { aspect-ratio: 1; background: var(--broto); display: flex; align-items: center; justify-content: center; }
.foto .img img { width: 100%; height: 100%; object-fit: cover; }

.foto p { padding: 0.5rem 0.7rem; font-size: 0.85rem; }

details.faq { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; }
details.faq summary { min-height: 60px; padding: 0.8rem 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; }
details.faq p { padding: 0 1rem 1rem; }

.campo { width: 100%; min-height: 60px; border: 2px solid var(--linha); border-radius: 14px; padding: 0 1rem; font-size: 1.1rem; background: var(--cartao); }
.campo:focus { border-color: var(--folha); outline: none; }

.cabeca-quiz { display: flex; align-items: center; gap: 0.8rem; }
.cabeca-quiz .progresso { flex: 1; }

.vendedor {
  position: fixed; inset: 0; background: #fff; z-index: 20; overflow-y: auto;
  padding: 1.2rem; display: none; flex-direction: column; gap: 1rem;
}
.vendedor.aberto { display: flex; }
.vendedor ul { margin: 0; padding: 0; list-style: none; }
.vendedor li { font-size: 1.45rem; font-weight: 700; padding: 0.7rem 0; border-bottom: 2px solid var(--linha); line-height: 1.3; }

.dialogo-fundo { position: fixed; inset: 0; background: rgba(22,35,26,0.55); z-index: 30; display: none; align-items: flex-end; justify-content: center; }
.dialogo-fundo.aberto { display: flex; }
.dialogo { background: var(--cartao); width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 1.3rem 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.8rem; }

.aviso { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 0.8rem 1.1rem; border-radius: 14px; font-weight: 700; z-index: 40; max-width: 90%; display: none; text-align: center; }
.aviso.aberto { display: block; }

.carregando { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 3rem 0; text-align: center; }
.girando { width: 64px; height: 64px; border-radius: 50%; border: 6px solid var(--broto); border-top-color: var(--folha); animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }

.linha-info { display: flex; justify-content: space-between; gap: 1rem; padding: 0.5rem 0; border-top: 1px solid var(--linha); }
.linha-info:first-child { border-top: 0; }
.linha-info span:last-child { font-weight: 700; text-align: right; }

.projetos { display: flex; flex-direction: column; gap: 0.8rem; }
.projeto-item { text-align: left; cursor: pointer; display: grid; grid-template-columns: 96px 1fr; gap: 0.8rem; align-items: center; background: var(--cartao); border: 2px solid var(--linha); border-radius: 16px; padding: 0.7rem; }
.projeto-item:hover { border-color: var(--folha); }
.projeto-item .mini { background: var(--agua-clara); border-radius: 10px; overflow: hidden; aspect-ratio: 1; display: block; }
.projeto-item .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
.filtros { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.2rem; }
.filtro { min-height: 48px; padding: 0 1rem; border-radius: 999px; border: 2px solid var(--linha); background: var(--cartao); font-weight: 700; white-space: nowrap; cursor: pointer; }
.filtro[aria-pressed="true"] { background: var(--folha); color: #fff; border-color: var(--folha); }

.marcar { display: flex; align-items: center; gap: 0.8rem; min-height: 60px; padding: 0.6rem 1rem; border: 2px solid var(--linha); border-radius: 14px; background: var(--cartao); cursor: pointer; font-weight: 700; }
.marcar input { width: 30px; height: 30px; accent-color: var(--folha); flex: none; }
</style>
</head>

    </button>

      Ajuda
    </button>
  </nav>
</div>

<div class="vendedor" id="vendedor" role="dialog" aria-modal="true" aria-label="Lista para mostrar ao vendedor"></div>

<div class="dialogo-fundo" id="dialogo-letra">
  <div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="titulo-letra">
    <h2 id="titulo-letra">Tamanho da letra</h2>
    <div class="opcoes">
      <button class="opcao" data-letra="" type="button"><span style="font-size:19px">Normal</span></button>
      <button class="opcao" data-letra="letra-grande" type="button"><span style="font-size:22px">Grande</span></button>
      <button class="opcao" data-letra="letra-enorme" type="button"><span style="font-size:25px">Muito grande</span></button>
    </div>
    <button class="btn secundario" data-fechar="dialogo-letra" type="button">Fechar</button>
  </div>
</div>

      h += '<section class="cartao hoje" aria-live="polite"><span class="etiqueta sol">Convite pronto</span><p>' + esc(S.conviteTexto) + '</p><button class="btn" type="button" data-acao="fam-copiar">Copiar e mandar no WhatsApp</button></section>';
    }
    return h;
  };


  telas.semana = function () {
    var d = Math.max(1, Math.min(7, S.semanaDia || Math.min(7, Math.max(1, diaDaHorta())))), x = SEMANA[d - 1];
    var h = '<button class="btn secundario" data-volta="1" type="button">' + ICONE_VOLTA + ' Voltar</button>';
    h += '<span class="etiqueta">Primeira Semana Guiada</span>';
    h += '<div class="filtros">' + SEMANA.map(function (z) { return '<button class="filtro" type="button" data-acao="semana-dia" data-d="' + z.dia + '" aria-pressed="' + (z.dia === d) + '">Dia ' + z.dia + '</button>'; }).join("") + '</div>';
    h += '<h1>Dia ' + d + ': ' + esc(x.titulo) + '</h1>';
    h += '<section class="cartao hoje"><p><strong>Tarefa de hoje:</strong> ' + esc(x.tarefa) + '</p></section>';
    h += '<button class="btn agua" type="button" data-acao="ouvir-semana">Ouvir o recado do dia</button>';
    h += '<section class="cartao" id="texto-semana">' + x.texto.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") + '</section>';
    return h;
  };

  telas.projetos = function () {
    var filtros = [["todos", "Todos"], ["premium", "Premium"], ["semAbaixar", "Sem abaixar"], ["barato", "Até R$200"], ["janela", "Janela"], ["varanda", "Varanda"], ["quintal", "Quintal"]];
    var h = '<button class="btn secundario" data-volta="1" type="button">' + ICONE_VOLTA + ' Voltar</button><h1>Projetos</h1>';
    h += '<div class="filtros">' + filtros.map(function (f) { return '<button class="filtro" type="button" data-acao="filtro" data-f="' + f[0] + '" aria-pressed="' + (S.filtro === f[0]) + '">' + f[1] + '</button>'; }).join("") + '</div>';
    var lista = PROJETOS.filter(function (p) { return S.filtro === "todos" || p.tags.indexOf(S.filtro) >= 0; });
    h += '<div class="projetos">' + lista.map(function (p) {
      return '<button class="projeto-item" type="button" data-acao="ver-projeto" data-id="' + p.id + '"><span class="mini">' + desenho(p.img || p.tipo) + '</span><span><strong>' + esc(p.nome) + '</strong><br><span class="suave pequeno">' + p.plantas + ' ' + rotuloPlantas(p) + ' · ' + esc(p.custo) + (p.premium ? " · <strong>Premium</strong>" : "") + (p.id === S.projetoId ? " · <strong>sua horta</strong>" : "") + '</span></span></button>';
    }).join("") + '</div>';
    return h;
  };

  telas.quiz = function () {
    var i = S.quizI || 0;
    if (i === 0) {
      return '<div class="cabeca-quiz"><span class="suave"><strong>Antes de começar</strong></span></div><h1>Como podemos te chamar?</h1>' +
        '<form id="form-nome" class="btns"><label for="campo-nome" class="suave">Seu primeiro nome</label><input class="campo" id="campo-nome" autocomplete="given-name" value="' + esc(S.exemplo ? "" : S.nome) + '"><button class="btn" type="submit">Continuar ' + ICONE_SETA + '</button></form>' +
        '<button class="btn secundario" data-ir="hoje" type="button">Agora não</button>';
    }
    var q = PERGUNTAS[i - 1];
    var h = '<div class="cabeca-quiz"><button class="btn-topo" data-acao="quiz-volta" type="button" aria-label="Pergunta anterior">' + ICONE_VOLTA + '</button><div class="progresso" aria-hidden="true"><span style="width:' + Math.round(i / PERGUNTAS.length * 100) + '%"></span></div><span class="suave pequeno"><strong>' + i + ' de ' + PERGUNTAS.length + '</strong></span></div>';
    h += '<h1>' + esc(q.t) + '</h1><div class="opcoes">' + q.o.map(function (o) {
      var marcado = S.respostas[q.id] === o[0];
      return '<button class="opcao" type="button" data-acao="responder" data-q="' + q.id + '" data-v="' + o[0] + '"><span class="marcador" aria-hidden="true"' + (marcado ? ' style="background:var(--folha);border-color:var(--folha)"' : "") + '></span><span>' + esc(o[1]) + (o[2] ? "<small>" + esc(o[2]) + "</small>" : "") + '</span></button>';
    }).join("") + '</div>';
    return h;
  };

  telas.montando = function () {
    return '<div class="carregando"><div class="girando" aria-hidden="true"></div><h2>Montando o seu projeto…</h2><p class="suave">Juntando seu espaço, seu orçamento e o que você quer colher.</p></div>';
  };

  telas.resultado = function () {
    var id = S.recomendado || recomendar(S.respostas), p = projeto(id), r = S.respostas;
    var motivos = ["espaco", "orcamento", "colher", "postura"].filter(function (k) { return r[k]; }).map(function (k) { return ROTULO[k + ":" + r[k]]; });
    var h = '<p class="suave"><strong>' + esc(S.nome || "Pronto") + ', este é o seu projeto ideal</strong></p><h1>' + esc(p.nome) + '</h1>';
    h += '<section class="cartao"><div class="desenho">' + desenho(p.img || p.tipo) + '</div>' +
      '<div class="etiquetas"><span class="chip">' + p.plantas + ' ' + rotuloPlantas(p) + '</span>' + (p.semAbaixar ? '<span class="chip">Sem abaixar</span>' : "") + '<span class="chip">' + esc(p.nivel) + '</span></div>' +
      '<div><div class="linha-info"><span>Onde</span><span>' + esc(p.espaco) + '</span></div><div class="linha-info"><span>Custo estimado</span><span>' + esc(p.custo) + '</span></div><div class="linha-info"><span>Primeira colheita</span><span>cerca de ' + p.ciclo + ' dias depois das mudas</span></div><div class="linha-info"><span>Energia</span><span>' + esc(p.energia) + '</span></div></div></section>';
    if (motivos.length) h += '<section class="cartao verde"><h3>Escolhemos este porque você disse</h3><ul class="passos">' + motivos.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + '</ul></section>';
    if (r.sol === "pouco") h += '<section class="cartao alerta"><p><strong>Pouco sol:</strong> escolha o cantinho mais claro da casa ou use uma lâmpada de LED para plantas. O app mostra como na montagem.</p></section>';
    if (r.sol === "tarde") h += '<section class="cartao alerta"><p><strong>Sol forte à tarde:</strong> deixe o reservatório na sombra e, se puder, use uma tela de sombra nas horas mais quentes.</p></section>';
    if (r.experiencia === "terra") h += '<section class="cartao agua"><p><strong>Se a horta na terra não deu certo, a culpa não foi sua.</strong> Agora o app acompanha você todos os dias e avisa antes do problema aparecer.</p></section>';
    h += '<div class="btns"><button class="btn" data-acao="escolher" data-id="' + p.id + '" type="button">É este! Começar a montagem ' + ICONE_SETA + '</button><button class="btn secundario" data-ir="projetos" type="button">Ver outros projetos</button></div>';
    return h;
  };

  telas.verProjeto = function () {
    var p = projeto(S.vendo), h = '<button class="btn secundario" data-volta="1" type="button">' + ICONE_VOLTA + ' Voltar</button><h1>' + esc(p.nome) + '</h1>';
    h += '<section class="cartao"><div class="desenho">' + desenho(p.img || p.tipo) + '</div><div class="etiquetas"><span class="chip">' + p.plantas + ' ' + rotuloPlantas(p) + '</span>' + (p.semAbaixar ? '<span class="chip">Sem abaixar</span>' : "") + '<span class="chip">' + esc(p.nivel) + '</span></div>' +
      '<div><div class="linha-info"><span>Onde</span><span>' + esc(p.espaco) + '</span></div><div class="linha-info"><span>Custo estimado</span><span>' + esc(p.custo) + '</span></div><div class="linha-info"><span>Energia</span><span>' + esc(p.energia) + '</span></div><div class="linha-info"><span>Etapas de montagem</span><span>' + etapas(p).length + '</span></div></div></section>';
    if (p.premium) h += '<section class="cartao hoje"><span class="etiqueta sol">Projeto Premium</span><p>O guia completo deste projeto, com cuidados e colheita, está no PDF dos Projetos Premium.</p><a class="btn agua" href="../produtos/horta-guiada-projetos-premium.pdf">Abrir o guia em PDF</a></section>';
    h += p.id === S.projetoId ? '<p><strong>Esta já é a sua horta.</strong></p>' : '<button class="btn" data-acao="escolher" data-id="' + p.id + '" type="button">Quero montar este</button>';
    return h;
  };

  /* ---------------- Roteador ---------------- */
  var ABA_DE = { hoje: "hoje", horta: "horta", montagem: "horta", compras: "horta", adubo: "horta", fita: "horta", projetos: "horta", verProjeto: "horta", familia: "ajuda", semana: "hoje", doutor: "doutor", diario: "diario", ajuda: "ajuda", quiz: "", montando: "", resultado: "" };
  var historico = [];
  var atual = "hoje";

  function ir(nome, semHistorico) {
    if (!telas[nome]) nome = "hoje";
    if (!semHistorico && atual !== nome) historico.push(atual);
    atual = nome;
    if (["hoje", "horta", "doutor", "diario", "ajuda"].indexOf(nome) >= 0) {
      try { history.replaceState(null, "", "#" + nome); } catch (e) {}
    }
    desenhar();
  }
  function voltar() { var a = historico.pop() || "hoje"; ir(a, true); }

  function desenhar() {
    var tela = document.getElementById("tela");
    tela.innerHTML = telas[atual]();
    tela.scrollTop = 0;
    var aba = ABA_DE[atual];
    document.querySelectorAll(".aba").forEach(function (b) {
      if (b.getAttribute("data-ir") === aba) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    var form = document.getElementById("form-nome");
    if (form) form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      S.nome = document.getElementById("campo-nome").value.trim() || "";
      S.quizI = 1; salvar(); desenhar();
    });
    var fd = document.getElementById("foto-doutor");
    if (fd) fd.addEventListener("change", function () { lerFoto(fd, function (u) { S.fotoDoutor = u; S.sintoma = null; desenhar(); aviso("Foto recebida. Agora escolha o que você vê."); }); });
    var fdi = document.getElementById("foto-diario");
    if (fdi) fdi.addEventListener("change", function () { lerFoto(fdi, function (u) { S.diario.push({ dia: Math.max(1, diaDaHorta()), texto: "Foto de hoje", img: u }); desenhar(); aviso("Foto guardada no diário."); }); });
    var ff = document.getElementById("form-familia");
    if (ff) ff.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var nome = document.getElementById("fam-nome").value.trim(), par = document.getElementById("fam-par").value;
      if (!nome) return;
      S.familia = S.familia || [];
      if (S.familia.length >= 2) { aviso("As 2 vagas já estão ocupadas."); return; }
      S.familia.push({ nome: nome, parentesco: par });
      S.conviteTexto = "Oi, " + nome + "! Estou com uma horta em casa e quero que você acompanhe pelo celular. Toque no link para entrar: horta-guiada.app/familia (link de exemplo)";
      desenhar(); aviso("Convite criado.");
    });
    var al = document.getElementById("ajuste-letra");
    if (al) al.addEventListener("click", abrirLetra);
    salvar();
  }

  function lerFoto(input, cb) {
    var f = input.files && input.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 900, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = function () { aviso("Não consegui abrir esta foto. Tente outra."); };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  }

  var tempoAviso;
  function aviso(t) {
    var a = document.getElementById("aviso");
    a.textContent = t; a.classList.add("aberto");
    clearTimeout(tempoAviso); tempoAviso = setTimeout(function () { a.classList.remove("aberto"); }, 3200);
  }

  function copiar(texto, ok) {
    try {
      navigator.clipboard.writeText(texto).then(function () { aviso(ok); }, function () { aviso("Não consegui copiar neste aparelho."); });
    } catch (e) { aviso("Não consegui copiar neste aparelho."); }
  }

  function abrirLetra() { document.getElementById("dialogo-letra").classList.add("aberto"); }

  /* ---------------- Ações ---------------- */
  document.addEventListener("click", function (ev) {
    var alvo = ev.target.closest("[data-ir],[data-acao],[data-volta],[data-letra],[data-fechar]");
    if (!alvo) return;
    if (alvo.hasAttribute("data-ir")) {
      var destino = alvo.getAttribute("data-ir");
      if (destino === "quiz") { S.quizI = 0; S.respostas = S.respostas || {}; }
      if (destino === "fita") S.phEscolhido = null;
      if (destino === "semana") S.semanaDia = null;
      ir(destino); return;
    }
    if (alvo.hasAttribute("data-volta")) { voltar(); return; }
    if (alvo.hasAttribute("data-letra")) {
      var cls = alvo.getAttribute("data-letra");
      document.documentElement.classList.remove("letra-grande", "letra-enorme");
      if (cls) document.documentElement.classList.add(cls);
      S.letra = cls; salvar();
      document.getElementById("dialogo-letra").classList.remove("aberto");
      return;
    }
    if (alvo.hasAttribute("data-fechar")) { document.getElementById(alvo.getAttribute("data-fechar")).classList.remove("aberto"); return; }

    var a = alvo.getAttribute("data-acao"), p = projeto(S.projetoId);
    switch (a) {
      case "feito": S.feitasEm[chaveHoje()] = true; desenhar(); aviso("Muito bem! Tarefa de hoje feita."); break;
      case "desfazer": delete S.feitasEm[chaveHoje()]; desenhar(); break;
      case "preco+": S.preco = Math.min(20, S.preco + 1); desenhar(); break;
      case "preco-": S.preco = Math.max(1, S.preco - 1); desenhar(); break;
      case "litros+": S.litros = Math.min(200, S.litros + 5); desenhar(); break;
      case "litros-": S.litros = Math.max(5, S.litros - 5); desenhar(); break;
      case "adubo-po": S.adubo = "po"; desenhar(); break;
      case "adubo-liq": S.adubo = "liq"; desenhar(); break;
      case "ph": S.phEscolhido = Number(alvo.getAttribute("data-i")); desenhar(); break;
      case "sintoma":
        S.sintoma = alvo.getAttribute("data-id"); desenhar();
        var r = document.getElementById("resposta-doutor"); if (r) r.scrollIntoView({ behavior: "smooth", block: "start" });
        break;
      case "passo+": S.passosFeitos[S.passo] = true; S.passo = Math.min(etapas(p).length - 1, (S.passo || 0) + 1); desenhar(); break;
      case "passo-": S.passo = Math.max(0, (S.passo || 0) - 1); desenhar(); break;
      case "marcar-passo": S.passosFeitos[alvo.getAttribute("data-i")] = alvo.checked; salvar(); break;
      case "plantei":
        S.passosFeitos[etapas(p).length - 1] = true; S.inicio = HOJE.toISOString(); S.feitasEm = {};
        S.diario = [{ dia: 1, texto: "Montei a horta e coloquei as mudas", tam: 1 }];
        historico = []; ir("hoje", true); aviso("Parabéns! Sua horta começou hoje.");
        break;
      case "vendedor": abrirVendedor(); break;
      case "copiar-lista": copiar("Lista de compras: " + p.nome + "\n" + listaCompras(p).map(function (x) { return "- " + x; }).join("\n"), "Lista copiada. Cole no WhatsApp."); break;
      case "compartilhar": copiar("Olha a minha horta! Hoje é o dia " + Math.max(1, diaDaHorta()) + " da minha " + p.nome + ".", "Mensagem copiada. Cole no WhatsApp da família."); break;
      case "whatsapp": aviso("No app final, este botão abre o WhatsApp do suporte."); break;
      case "exemplo": var l = S.letra; S = estadoExemplo(); S.letra = l; historico = []; ir("hoje", true); break;
      case "semana-dia": S.semanaDia = Number(alvo.getAttribute("data-d")); desenhar(); break;
      case "ouvir-semana": falar(document.getElementById("texto-semana").innerText); break;
      case "fam-remover": S.familia.splice(Number(alvo.getAttribute("data-i")), 1); S.conviteTexto = null; desenhar(); break;
      case "fam-copiar": copiar(S.conviteTexto, "Convite copiado. Cole no WhatsApp."); break;
      case "filtro": S.filtro = alvo.getAttribute("data-f"); desenhar(); break;
      case "ver-projeto": S.vendo = alvo.getAttribute("data-id"); ir("verProjeto"); break;
      case "quiz-volta": S.quizI = Math.max(0, (S.quizI || 1) - 1); desenhar(); break;
      case "responder":
        S.respostas[alvo.getAttribute("data-q")] = alvo.getAttribute("data-v");
        if (S.quizI < PERGUNTAS.length) { S.quizI++; desenhar(); }
        else {
          S.recomendado = recomendar(S.respostas); ir("montando");
          setTimeout(function () { if (atual === "montando") ir("resultado", true); }, 1800);
        }
        break;
      case "escolher":
        S.projetoId = alvo.getAttribute("data-id"); S.exemplo = false; S.inicio = null; S.passo = 0; S.passosFeitos = {};
        S.feitasEm = {}; S.diario = []; historico = ["hoje"]; ir("montagem", true);
        break;
    }
  });

  function abrirVendedor() {
    var p = projeto(S.projetoId), v = document.getElementById("vendedor");
    v.innerHTML = '<button class="btn" id="fechar-vendedor" type="button">Fechar</button><h1>Preciso destes materiais</h1><ul>' + listaCompras(p).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul><button class="btn secundario" id="fechar-vendedor2" type="button">Fechar</button>';
    v.classList.add("aberto");
    var f = function () { v.classList.remove("aberto"); };
    document.getElementById("fechar-vendedor").addEventListener("click", f);
    document.getElementById("fechar-vendedor2").addEventListener("click", f);
  }

  document.getElementById("btn-letra").addEventListener("click", abrirLetra);
  document.getElementById("dialogo-letra").addEventListener("click", function (ev) { if (ev.target === this) this.classList.remove("aberto"); });

  function falar(texto) {
    try {
      var sy = window.speechSynthesis;
      if (!sy) { aviso("Este aparelho não tem leitura em voz alta."); return; }
      if (sy.speaking) { sy.cancel(); return; }
      var u = new SpeechSynthesisUtterance(texto); u.lang = "pt-BR"; u.rate = 0.9;
      var vozes = sy.getVoices().filter(function (v) { return /pt(-|_)BR/i.test(v.lang); });
      if (vozes.length) u.voice = vozes[0];
      sy.speak(u); aviso("Lendo em voz alta. Toque de novo para parar.");
    } catch (e) { aviso("Não consegui ler em voz alta neste aparelho."); }
  }
  document.getElementById("btn-ouvir").addEventListener("click", function () {
    try {
      var sy = window.speechSynthesis;
      if (!sy) { aviso("Este aparelho não tem leitura em voz alta."); return; }
      if (sy.speaking) { sy.cancel(); return; }
      var texto = document.getElementById("tela").innerText.replace(/\s+/g, " ").slice(0, 1500);
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = "pt-BR"; u.rate = 0.9;
      var vozes = sy.getVoices().filter(function (v) { return /pt(-|_)BR/i.test(v.lang); });
      if (vozes.length) u.voice = vozes[0];
      sy.speak(u);
      aviso("Lendo a tela. Toque em Ouvir de novo para parar.");
    } catch (e) { aviso("Não consegui ler em voz alta neste aparelho."); }
  });

  window.addEventListener("hashchange", function () {
    var h = location.hash.replace("#", "");
    if (telas[h] && h !== atual) ir(h, true);
  });

  if (S.letra) document.documentElement.classList.add(S.letra);
  var inicial = location.hash.replace("#", "");
  atual = ["hoje", "horta", "doutor", "diario", "ajuda"].indexOf(inicial) >= 0 ? inicial : "hoje";
  desenhar();
})();
</script>
</body>
</html>
